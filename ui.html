<h2>Selection Xml Exporter</h2>
<p>Let's select SceneNode that you want to export to xml, then click "export" button.</p>
<p id="sel-num"></p>
<button id="export">export</button>
<button id="cancel">cancel</button>
<script>

document.getElementById('export').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*')
}

document.getElementById('cancel').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*')
}

window.onmessage = (event) => {
    const receivedData = event.data.pluginMessage; 
    
    // console.log("プラグインコードからこれを受け取りました:", receivedData); // [1]
    if (receivedData.type === 'EXPORT_REQUEST') {

      const convertedData = receivedData.convertedData;

      // データをBlobとして作成し、ダウンロードリンクを生成します。
        // （ブラウザAPIはこの iframe 内でのみ利用可能です [1]）
        const blob = new Blob([convertedData], { type: 'application/xml' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'exported_nodes.xml';
        
        // 仮想的なクリックイベントを発火させ、ダウンロードをトリガー
        a.click();
        
        // ダウンロードが開始されたら、メインスレッドに完了を通知し、
        // プラグインを閉じるよう指示します (parent.postMessage を使用) [6]。
        parent.postMessage({ pluginMessage: { type: 'EXPORT_RESPONSE' } }, '*');
    }
    else if (receivedData.type === 'selectionChanged') {
      document.getElementById('sel-num').textContent = `num selected nodes: ${receivedData.num}`;
    }
   
};

</script>
