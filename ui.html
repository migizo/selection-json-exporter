<h2>Selection Xml Exporter</h2>
<p>Let's select SceneNode that you want to export to xml, then click "export" button.</p>
<p id="sel-num"></p>
<button id="export">export</button>
<button id="copy">copy</button>
<button id="cancel">cancel</button>
<textarea id="textarea"></textarea>

<style>
textarea {
  width: 100%;
  height: 50%;
  box-sizing: border-box;
}
</style>

<script>
document.getElementById('export').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*')
}

document.getElementById('copy').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'copy' } }, '*')
}

document.getElementById('cancel').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'quit' } }, '*')
}

function copyToClipboard(str)
{
  textArea = document.getElementById('textarea');
  textArea.value = str;
  textArea.focus();
  textArea.select();
  document.execCommand('copy');
}

function exportFile(str)
{
  // データをBlobとして作成し、ダウンロードリンクを生成します。
  // （ブラウザAPIはこの iframe 内でのみ利用可能です [1]）
  const blob = new Blob([str], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = 'exported_nodes.xml';
  
  // 仮想的なクリックイベントを発火させ、ダウンロードをトリガー
  a.click();
}

window.onmessage = (event) => {
    const receivedData = event.data.pluginMessage; 
    
    // console.log("プラグインコードからこれを受け取りました:", receivedData); // [1]
    if (receivedData.type === 'EXPORT') {

      exportFile(receivedData.convertedData);
      const convertedData = receivedData.convertedData;
        
      parent.postMessage({ pluginMessage: { type: 'response' } }, '*');
    }
    else if (receivedData.type === 'COPY') {
      copyToClipboard(receivedData.convertedData);
    }
    else if (receivedData.type === 'UPDATE_SELECTION') {
      document.getElementById('sel-num').textContent = `num selected nodes: ${receivedData.num}`;
      document.getElementById('textarea').value = receivedData.convertedData;
    }
};

</script>
